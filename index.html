<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>제조요청사양서</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0a5e34">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="제조요청">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
/* 레이아웃: 종이 양식을 그대로 옮긴 한 줄 흐름. 상단 고정 헤더, 본문 중앙 열, 하단 고정 진행바 */
:root{
  --green:#0e8a4b; --green-d:#0a5e34; --green-l:#e6f3eb;
  --ink:#19211d; --mut:#5b6962; --line:#cbd6cf; --bg:#eef2ef; --paper:#fff;
  --err:#c0392b; --err-bg:#fdecea; --warn:#b26a00;
  --font:'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font);font-size:14px;color:var(--ink);background:var(--bg);line-height:1.5}
button,input,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}

.top{background:var(--paper);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.top-in{max-width:960px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.top img{height:34px;display:block}
.top h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.02em}
.steps{margin-left:auto;display:flex;gap:6px;font-size:13px;color:var(--mut)}
.steps span{padding:4px 12px;border-radius:99px;border:1px solid var(--line)}
.steps .on{background:var(--green);color:#fff;border-color:var(--green);font-weight:500}
.notice{max-width:960px;margin:0 auto;padding:8px 20px 0;font-size:12px;color:var(--mut)}

main{max-width:960px;margin:0 auto;padding:12px 20px 120px}

.banner{background:var(--green-l);border:1px solid #b7dcc6;border-radius:6px;padding:10px 14px;margin:10px 0;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:13px}
.banner button{margin-left:auto}
.errs{background:var(--err-bg);border:1px solid #f0b9b2;border-radius:6px;padding:12px 16px;margin:10px 0}
.errs h3{margin:0 0 6px;font-size:14px;color:var(--err)}
.errs ul{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:6px}
.errs li button{background:#fff;border:1px solid #e3a59d;color:var(--err);border-radius:99px;padding:2px 10px;font-size:12.5px;cursor:pointer}
.errs li button:hover{background:var(--err);color:#fff}

.sc{background:var(--paper);border:1px solid var(--line);margin-top:16px}
.sc>h2{margin:0;padding:10px 16px;font-size:15px;font-weight:700;background:var(--green-d);color:#fff;letter-spacing:.02em}
.sc>h2 .mk{margin-right:6px}
.row2{display:grid;grid-template-columns:1fr 1fr}
.f{padding:10px 16px 12px;border-top:1px solid var(--line);min-width:0}
.row2>.f+.f{border-left:1px solid var(--line)}
.sc>h2+.row2>.f,.sc>h2+.f,.sc>.subhead+.row2>.f{border-top:0}
.f .lb{display:block;font-size:12.5px;font-weight:700;color:var(--green-d);margin-bottom:5px}
.f .req{color:var(--err);margin-left:2px}
.note{font-size:12px;color:var(--mut);margin-top:4px}
.subhead{display:grid;grid-template-columns:1fr 1fr;background:var(--green-l);font-weight:700;font-size:13px;color:var(--green-d)}
.subhead div{padding:7px 16px}
.subhead div+div{border-left:1px solid var(--line)}

input[type=text],input[type=tel],input[type=number],input[type=date],textarea{
  width:100%;border:1px solid #aebbb3;border-radius:4px;padding:7px 9px;background:#fff;min-height:36px}
textarea{resize:vertical;min-height:64px}
input:focus,textarea:focus{outline:2px solid var(--green);outline-offset:0;border-color:var(--green)}
input:disabled,textarea:disabled{background:#eef2ef;color:#8a968f}
.inl{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.inl .grow{flex:1 1 140px;min-width:0}
.unit{font-size:13px;color:var(--mut);white-space:nowrap}
.auto{padding:7px 9px;background:#f4f7f5;border:1px dashed #aebbb3;border-radius:4px;min-height:36px;font-weight:500}
.auto small{color:var(--mut);font-weight:400}

.opts{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center}
.ck{display:inline-flex;align-items:center;gap:7px;cursor:pointer;position:relative;user-select:none}
.ck input{position:absolute;opacity:0;width:18px;height:18px;margin:0}
.ck .box{width:18px;height:18px;border:1.5px solid #6f7f76;border-radius:2px;background:#fff;display:inline-block;flex:none;position:relative}
.ck input:checked+.box{background:var(--green);border-color:var(--green)}
.ck input:checked+.box::after{content:"";position:absolute;left:5px;top:1px;width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.ck input:focus-visible+.box{outline:2px solid var(--green);outline-offset:2px}
.ck.alt{font-size:13px;color:var(--mut)}
.oth{width:160px!important;min-height:32px!important;padding:4px 8px!important}

.f.err{background:var(--err-bg)}
.f.err .lb{color:var(--err)}
.f.err input[type=text],.f.err input[type=tel],.f.err input[type=number],.f.err input[type=date],.f.err textarea{border-color:var(--err)}
.f.err .box{border-color:var(--err)}

.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.tools .sp{flex:1}

.dz{border:2px dashed #94a89d;border-radius:6px;padding:16px;text-align:center;color:var(--mut);cursor:pointer;background:#f9fbfa}
.dz:hover,.dz.over,.dz:focus-visible{border-color:var(--green);background:var(--green-l);outline:none;color:var(--green-d)}
.thumbs{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.th{position:relative;width:150px;border:1px solid var(--line);background:#fff}
.th img{display:block;width:100%;height:110px;object-fit:contain;background:#f4f7f5}
.th .nm{font-size:11px;padding:3px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--mut)}
.th button{position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;cursor:pointer;line-height:1}

.btn{border:1px solid var(--green);background:var(--green);color:#fff;border-radius:4px;padding:8px 16px;cursor:pointer;font-weight:500}
.btn:hover{background:var(--green-d)}
.btn.ghost{background:#fff;color:var(--green-d)}
.btn.ghost:hover{background:var(--green-l)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

.bar{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--line);z-index:20}
.bar-in{max-width:960px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.prog{flex:1 1 220px;min-width:0}
.prog .t{font-size:12.5px;color:var(--mut)}
.prog .t b{color:var(--ink)}
.meter{height:6px;background:#dfe7e2;border-radius:3px;overflow:hidden;margin-top:4px}
.meter i{display:block;height:100%;background:var(--green);width:0;transition:width .25s}

/* 2단계 */
.panel{background:var(--paper);border:1px solid var(--line);padding:16px;margin:12px 0;display:grid;gap:12px}
.panel .line{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.cnt{font-size:12.5px;color:var(--mut)}
.docbox{overflow-x:auto;background:#d9e0dc;padding:16px;margin-top:12px}

/* 완성된 사양서 (화면 미리보기 = PDF 원본) */
#doc{width:740px;margin:0 auto;background:#fff;color:#111;padding:14px 18px 16px;font-size:11px;line-height:1.4}
#doc .hd{display:flex;justify-content:space-between;align-items:center}
#doc .hd img{height:34px}
#doc .hd .dt0{font-size:11px}
#doc .ttl{text-align:center;font-size:21px;font-weight:700;letter-spacing:.3em;margin:6px 0 2px}
#doc .sh{background:#0a5e34;color:#fff;font-weight:700;padding:3px 8px;margin-top:9px;font-size:11.5px}
#doc table.dt{width:100%;border-collapse:collapse;table-layout:fixed}
#doc .dt th,#doc .dt td{border:1px solid #8fa399;padding:3px 7px;vertical-align:middle;white-space:pre-wrap;word-break:break-word;text-align:left}
#doc .dt th{background:#e6f3eb;width:17%;font-weight:700;font-size:10.5px}
#doc .dt td{width:33%}
#doc .dt td.full{width:83%}
#doc .dt th.sub{width:50%;background:#cfe7d9}
#doc .imgrow{margin-top:5px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
#doc .imgrow img{border:1px solid #ccc;object-fit:contain}
#doc .empty{color:#b00}

.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#19211d;color:#fff;padding:10px 18px;border-radius:6px;z-index:50;font-size:13px;max-width:90vw}

/* 부자재 사양: PC는 좌우 2열(종이 양식 그대로), 모바일은 내용물 → 포장박스 순서로 한 줄씩 */
.split{display:grid;grid-template-columns:1fr 1fr;background:var(--paper)}
.split .sub{padding:7px 16px;background:var(--green-l);font-weight:700;font-size:13px;color:var(--green-d)}
.split .sub.g-b{border-left:1px solid var(--line)}
.split>.f.g-b{border-left:1px solid var(--line)}
.split>.f.r1{border-top:0}
@media (max-width:640px){
  .split{display:flex;flex-direction:column}
  .split .g-c.sub{order:0}
  .split>.f.g-c{order:1}
  .split .g-b.sub{order:2;border-left:0;border-top:1px solid var(--line)}
  .split>.f.g-b{order:3;border-left:0}
  .split>.f.r1{border-top:1px solid var(--line)}
  .split>.f.g-c.r1{border-top:0}
  .split .g-b.sub+.f.r1,.split>.f.g-b.r1{border-top:0}
  .row2,.subhead{grid-template-columns:1fr}
  .row2>.f+.f,.subhead div+div{border-left:0}
  .row2>.f+.f{border-top:1px solid var(--line)}
  .steps{display:none}
  main{padding:8px 12px 130px}
}
@media (prefers-reduced-motion:reduce){.meter i{transition:none}}
</style>
</head>

V=freshState();
let view='form';

function choiceOf(id){return V[id]&&V[id].s?V[id]:(V[id]={s:[],o:''})}
function selText(id){const f=F[id],c=choiceOf(id);return c.s.map(o=>f.other===o&&c.o?c.o:o).join(', ')}
function autoVal(id){
  if(id==='pkgVol')return selText('c_spec');
  if(id==='perBox')return selText('b_spec');
  if(id==='fill')return '                    g';
  return'';
}
function show(id){
  const f=F[id],v=V[id];
  if(f.alt&&V[id+'_a'])return f.alt;
  if(f.t==='choice'){const c=choiceOf(id);return f.o.map(o=>{const on=c.s.includes(o);return (on?'■ ':'□ ')+o+(on&&f.other===o&&c.o?` (${c.o}${f.ou||''})`:'')}).join('    ')}
  if(f.t==='auto')return autoVal(id);
  let s=String(v??'').trim();if(!s)return'';
  if(f.t==='number'){const n=Number(s.replace(/,/g,''));s=(isFinite(n)?n.toLocaleString('ko-KR'):s)+(f.u?' '+f.u:'')}
  return s;
}

/* ───────── 검증 ───────── */
function missing(id){
  const f=F[id];if(!f.req)return'';
  if(f.alt&&V[id+'_a'])return'';
  if(f.t==='imgs')return V[id+'s'].length?'':'시안 이미지를 첨부하거나 ‘시안 없음’을 체크하세요';
  if(f.t==='choice'){const c=choiceOf(id);if(!c.s.length)return'선택하세요';if(f.other&&c.s.includes(f.other)&&!c.o.trim())return'직접 입력 내용을 적으세요';return''}
  return String(V[id]??'').trim()?'':'입력하세요';
}
const REQ_IDS=Object.keys(F).filter(k=>F[k].req);
function allErrors(){return REQ_IDS.map(id=>({id,msg:missing(id)})).filter(e=>e.msg)}

/* ───────── 폼 그리기 ───────── */
function ctl(id){
  const f=F[id];let h='';
  const altHtml=f.alt?`<label class="ck alt"><input type="checkbox" data-id="${id}" data-alt><span class="box"></span>${f.alt}</label>`:'';
  if(f.t==='choice'){
    h+='<div class="opts">'+f.o.map(o=>`<label class="ck"><input type="checkbox" data-id="${id}" data-opt="${esc(o)}"><span class="box"></span>${esc(o)}</label>`).join('');
    if(f.other)h+=`<input type="text" class="oth" data-id="${id}" data-other placeholder="${f.ou?'수량 입력':'직접 입력'}" hidden>${f.ou?`<span class="unit" data-ou="${id}" hidden>${f.ou}</span>`:''}`;
    h+='</div>';
  }else if(f.t==='auto'){
    h=`<div class="auto" data-auto="${id}"></div>`;
  }else if(f.t==='area'){
    h=`<div class="inl"><textarea class="grow" data-id="${id}" placeholder="${esc(f.ph||'')}"></textarea>${altHtml}</div>`;
  }else{
    const type={text:'text',tel:'tel',number:'number',date:'date'}[f.t];
    h=`<div class="inl"><input class="grow" type="${type}" ${type==='number'?'inputmode="decimal" min="0" step="any"':''} data-id="${id}" placeholder="${esc(f.ph||'')}">${f.u?`<span class="unit">${f.u}</span>`:''}${altHtml}</div>`;
  }
  return h;
}
function cell(id,full,cls){
  const f=F[id];
  return `<div class="f${full?' full':''}${cls?' '+cls:''}" data-f="${id}"><label class="lb">${f.l}${f.req?'<span class="req" title="필수">*</span>':''}</label>${ctl(id)}${f.note?`<div class="note">${f.note}</div>`:''}</div>`;
}
function renderForm(){
  let h='';
  for(const s of LAYOUT){
    h+=`<section class="sc" id="sec-${s.k}"><h2><span class="mk">■</span>${s.title}</h2>`;
    if(s.split){
      h+=`<div class="split"><div class="sub g-c">${s.sub[0]}</div><div class="sub g-b">${s.sub[1]}</div>`;
      s.rows.forEach((r,i)=>{const x=i===0?' r1':'';h+=cell(r[0],0,'g-c'+x)+cell(r[1],0,'g-b'+x)});
      h+='</div>';
    }else if(s.rows){for(const r of s.rows){h+=r.length===1?cell(r[0],1):`<div class="row2">${cell(r[0])}${cell(r[1])}</div>`}}
    else if(s.special==='img'){
      const id=s.id,k=s.key;
      h+=`<div class="f" data-f="${id}"><div class="lb">${F[id].l}<span class="req">*</span></div>
        <div class="dz" tabindex="0" role="button" data-dz="${k}">여기에 이미지를 끌어다 놓거나, 클릭해서 선택하거나, 복사한 이미지를 붙여넣기(Ctrl+V)</div>
        <input type="file" accept="image/*" multiple hidden data-file="${k}">
        <div class="thumbs" id="th-${k}"></div>
        <div class="inl" style="margin-top:8px"><label class="ck alt"><input type="checkbox" data-id="${id}" data-alt><span class="box"></span>${F[id].alt}</label></div></div>
        <div class="f" data-f="${k}Note"><label class="lb">인쇄 사양 메모</label><textarea data-id="${k}Note" placeholder="시안 설명, 주의사항 등"></textarea></div>`;
    }
    h+='</section>';
  }
  $('#form').innerHTML=h;
  renderThumbs('box');renderThumbs('ctg');
  syncUI();
}
function renderThumbs(k){
  $('#th-'+k).innerHTML=V[k+'Imgs'].map((m,i)=>`<div class="th"><img src="${m.url}" alt=""><div class="nm">${esc(m.name)}</div><button type="button" data-rmimg="${k}:${i}" aria-label="이미지 삭제">✕</button></div>`).join('');
}
function syncUI(){
  $$('[data-id]').forEach(el=>{
    const id=el.dataset.id,f=F[id];
    if(el.dataset.opt!==undefined){el.checked=choiceOf(id).s.includes(el.dataset.opt)}
    else if(el.dataset.other!==undefined){const c=choiceOf(id);const on=f.other&&c.s.includes(f.other);el.hidden=!on;if(document.activeElement!==el)el.value=c.o;const u=$(`[data-ou="${id}"]`);if(u)u.hidden=!on}
    else if(el.dataset.alt!==undefined){el.checked=!!V[id+'_a']}
    else{if(document.activeElement!==el)el.value=V[id]??'';el.disabled=!!(f&&f.alt&&V[id+'_a'])}
  });
  $$('[data-auto]').forEach(el=>{
    const id=el.dataset.auto;
    if(id==='fill'){el.innerHTML='<small>생산팀에서 입력 예정 (영업 작성 불필요)</small>';return}
    const v=autoVal(id);el.innerHTML=v?esc(v):'<small>위 항목을 선택하면 자동으로 표시됩니다</small>';
  });
  updProgress();
}
function updProgress(){
  const total=REQ_IDS.length,done=REQ_IDS.filter(id=>!missing(id)).length;
  $('#progT').innerHTML=`필수 항목 <b>${done}</b> / ${total} 입력`+(done<total?` · 남은 항목 ${total-done}개`:' · 모두 입력됨');
  $('#progI').style.width=(done/total*100)+'%';
}

/* ───────── 이벤트 ───────── */
const form=$('#form');
let saveT=null;
function touch(){clearTimeout(saveT);saveT=setTimeout(autosave,400)}
function clearErr(id){const f=$(`[data-f="${id}"]`);if(f)f.classList.remove('err')}

form.addEventListener('input',e=>{
  const t=e.target,id=t.dataset.id;
  if(!id)return;const f=F[id];
  if(t.dataset.opt!==undefined){
    const c=choiceOf(id),o=t.dataset.opt;
    if(t.checked){if(f.multi){if(!c.s.includes(o))c.s.push(o)}else c.s=[o]}else c.s=c.s.filter(x=>x!==o);
  }else if(t.dataset.other!==undefined){choiceOf(id).o=t.value}
  else if(t.dataset.alt!==undefined){V[id+'_a']=t.checked}
  else V[id]=t.value;
  if(!missing(id))clearErr(id);
  if(id==='c_spec')clearErr('pkgVol');
  syncUI();touch();
});
form.addEventListener('click',e=>{
  const t=e.target;
  if(t.dataset.rmimg){const[k,i]=t.dataset.rmimg.split(':');V[k+'Imgs'].splice(+i,1);renderThumbs(k);syncUI();return}
  const dz=t.closest('[data-dz]');if(dz){$(`[data-file="${dz.dataset.dz}"]`).click()}
});
form.addEventListener('change',e=>{const t=e.target;if(t.dataset.file){addFiles(t.dataset.file,t.files);t.value=''}});
form.addEventListener('keydown',e=>{const dz=e.target.closest&&e.target.closest('[data-dz]');if(dz&&(e.key==='Enter'||e.key===' ')){e.preventDefault();$(`[data-file="${dz.dataset.dz}"]`).click()}});
['dragover','dragenter'].forEach(ev=>form.addEventListener(ev,e=>{const dz=e.target.closest&&e.target.closest('[data-dz]');if(dz){e.preventDefault();dz.classList.add('over')}}));
['dragleave','drop'].forEach(ev=>form.addEventListener(ev,e=>{const dz=e.target.closest&&e.target.closest('[data-dz]');if(dz)dz.classList.remove('over')}));
form.addEventListener('drop',e=>{const dz=e.target.closest&&e.target.closest('[data-dz]');if(dz){e.preventDefault();addFiles(dz.dataset.dz,e.dataTransfer.files)}});
document.addEventListener('paste',e=>{
  if(view!=='form')return;
  const dz=document.activeElement&&document.activeElement.closest&&document.activeElement.closest('[data-dz]');
  if(!dz)return;
  const files=[...(e.clipboardData?.files||[])].filter(f=>f.type.startsWith('image/'));
  if(files.length){e.preventDefault();addFiles(dz.dataset.dz,files)}
});

function loadImg(file){return new Promise((res,rej)=>{
  const u=URL.createObjectURL(file),im=new Image();
  im.onload=()=>{const m=1400,s=Math.min(1,m/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
    const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);
    res({name:file.name||'붙여넣은 이미지',url:c.toDataURL('image/jpeg',.88),w:c.width,h:c.height})};
  im.onerror=()=>{URL.revokeObjectURL(u);rej()};im.src=u})}
async function addFiles(k,files){
  let bad=0;
  for(const f of [...files]){
    if(!f.type.startsWith('image/')){bad++;continue}
    try{V[k+'Imgs'].push(await loadImg(f))}catch(_){bad++}
  }
  renderThumbs(k);clearErr(k+'Img');syncUI();
  if(bad)toast('이미지 파일(JPG, PNG 등)만 첨부할 수 있습니다. PDF는 이미지로 저장해서 올려주세요.');
}

/* ───────── 확인하기 ───────── */
function showErrors(list){
  const box=$('#errs');
  $$('.f.err').forEach(f=>f.classList.remove('err'));
  if(!list.length){box.hidden=true;return}
  box.hidden=false;
  box.innerHTML=`<h3>빠진 항목이 ${list.length}개 있습니다. 항목을 누르면 해당 위치로 이동합니다.</h3><ul>`+list.map(e=>`<li><button type="button" data-jump="${e.id}">${esc(F[e.id].l)}${e.id.startsWith('b_')?' (포장박스)':e.id.startsWith('c_')?' (카트리지)':''} · ${esc(SEC_OF[e.id]||'')}</button></li>`).join('')+'</ul>';
  list.forEach(e=>{const f=$(`[data-f="${e.id}"]`);if(f)f.classList.add('err')});
}
$('#errs').addEventListener('click',e=>{
  const id=e.target.dataset.jump;if(!id)return;
  const f=$(`[data-f="${id}"]`);if(!f)return;
  f.scrollIntoView({behavior:'smooth',block:'center'});
  const i=$('input:not([hidden]):not([disabled]),textarea',f);if(i)setTimeout(()=>i.focus({preventScroll:true}),300);
});
$('#btnCheck').addEventListener('click',()=>{
  const errs=allErrors();
  if(errs.length){showErrors(errs);window.scrollTo({top:0,behavior:'smooth'});return}
  showErrors([]);go('prev');
});

/* ───────── 화면 전환 ───────── */
let cache={};
function go(v){
  view=v;
  $('#viewForm').hidden=v!=='form';$('#viewPrev').hidden=v!=='prev';$('#barForm').hidden=v!=='form';$('#noticeTop').hidden=v!=='form';
  $('#st1').classList.toggle('on',v==='form');$('#st2').classList.toggle('on',v==='prev');
  cache={};
  if(v==='prev'){
    $('#doc').innerHTML=renderDoc();
    $('#okChk').checked=false;setOut(false);
    setTimeout(()=>{if(view==='prev'){if(window.html2pdf)getFile('pdf').catch(()=>{});if(window.ExcelJS)getFile('xlsx').catch(()=>{})}},400); // 공유 버튼이 바로 동작하도록 미리 만들어 둠
  }
  window.scrollTo({top:0});
}
$('#btnBack').addEventListener('click',()=>go('form'));
function setOut(on){['btnXlsx','btnPdf'].forEach(i=>$('#'+i).disabled=!on)}
$('#okChk').addEventListener('change',e=>setOut(e.target.checked));

/* ───────── 날짜·파일명 ───────── */
const pad=n=>String(n).padStart(2,'0');
function today(){const d=new Date();return`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
function baseName(){const p=(V.product_a?'제품명미정':(V.product||'제품')).trim().replace(/[\\/:*?"<>|]/g,'_');return`제조요청사양서_${p}_${today().replace(/-/g,'')}`}

/* ───────── 완성된 사양서 (미리보기 = PDF 원본) ───────── */
function renderDoc(){
  const v=id=>{const f=F[id];
    if(f.t==='choice'&&!(f.alt&&V[id+'_a'])){const c=choiceOf(id);return f.o.map(o=>{const on=c.s.includes(o);return `<span style="white-space:nowrap;margin-right:10px">${on?'■':'□'} ${esc(o)}${on&&f.other===o&&c.o?` (${esc(c.o)}${f.ou||''})`:''}</span>`}).join(' ')}
    const s=show(id);return s?esc(s):`<span class="${f.req?'empty':''}" style="${f.req?'':'color:#999'}">-</span>`};
  let h=`<div class="hd"><img src="${LOGO}" alt=""><div class="dt0">작성일 ${today()}</div></div><div class="ttl">제조요청사양서</div>`;
  for(const s of LAYOUT){
    h+=`<div class="sec"><div class="sh">■ ${s.title}</div>`;
    if(s.rows){
      h+='<table class="dt">';
      if(s.sub)h+=`<tr><th class="sub" colspan="2">${s.sub[0]}</th><th class="sub" colspan="2">${s.sub[1]}</th></tr>`;
      for(const r of s.rows){
        if(r.length===1)h+=`<tr><th>${F[r[0]].l}</th><td class="full" colspan="3">${v(r[0])}</td></tr>`;
        else h+=`<tr><th>${F[r[0]].l}</th><td>${v(r[0])}</td><th>${F[r[1]].l}</th><td>${v(r[1])}</td></tr>`;
      }
      h+='</table>';
    }else{
      const k=s.key,imgs=V[k+'Imgs'];
      if(V[s.id+'_a'])h+=`<table class="dt"><tr><td class="full" colspan="4">■ ${F[s.id].alt}</td></tr></table>`;
      if(imgs.length){
        const mh=imgs.length===1?200:imgs.length<=2?170:120;
        h+='<div class="imgrow">'+imgs.map(m=>`<img src="${m.url}" alt="" style="max-height:${mh}px;max-width:${imgs.length===1?'100%':'48%'}">`).join('')+'</div>';
      }
      if((V[k+'Note']||'').trim())h+=`<table class="dt" style="margin-top:5px"><tr><th>메모</th><td class="full" colspan="3">${esc(V[k+'Note'])}</td></tr></table>`;
    }
    h+='</div>';
  }
  return h;
}

/* ───────── 파일 만들기 ───────── */
const MIME={pdf:'application/pdf',xlsx:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'};
function need(lib){if(!window[lib]){toast('파일 생성 도구를 불러오지 못했습니다. 인터넷 연결을 확인한 뒤 새로고침하세요.');return false}return true}
function saveBlob(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}

const THIN={style:'thin',color:{argb:'FF8FA399'}},BD={top:THIN,left:THIN,bottom:THIN,right:THIN};
const FONT='맑은 고딕';
function lineCount(txt,w){let n=0;for(const ln of String(txt).split('\n')){let len=0;for(const ch of ln)len+=ch.charCodeAt(0)>255?2:1;n+=Math.max(1,Math.ceil(len/Math.max(4,w-2)))}return n}

async function buildXlsx(){
  const wb=new ExcelJS.Workbook();wb.creator='다우실란트산업㈜';wb.created=new Date();
  const ws=wb.addWorksheet('영업',{pageSetup:{paperSize:9,orientation:'portrait',fitToPage:true,fitToWidth:1,fitToHeight:0,margins:{left:.4,right:.4,top:.5,bottom:.5,header:.3,footer:.3}}});
  const W=[24,30,4,22,30];ws.columns=W.map(width=>({width}));
  const cw=(a,b)=>{let w=0;for(let c=a;c<=b;c++)w+=W[c-1];return w};
  const hmax={};
  function put(row,c1,c2,val,o={}){
    for(let c=c1;c<=c2;c++){const x=ws.getCell(row,c);x.border=BD;if(o.fill)x.fill={type:'pattern',pattern:'solid',fgColor:{argb:o.fill}}}
    const x=ws.getCell(row,c1);x.value=val;
    x.alignment={vertical:'middle',horizontal:o.h||'left',wrapText:true};
    x.font={name:FONT,size:o.size||10,bold:!!o.b,color:{argb:o.color||'FF1F2A24'}};
    if(c2>c1)ws.mergeCells(row,c1,row,c2);
    const hh=lineCount(val??'',cw(c1,c2))*(o.size?o.size*1.5:14.5)+8;
    hmax[row]=Math.max(hmax[row]||0,hh);
  }
  const fin=row=>{ws.getRow(row).height=Math.max(22,Math.min(400,hmax[row]||22))};
  const LB='FFE6F3EB',HD='FF0A5E34',SB='FFCFE7D9';

  // 머리글: 로고 / 제목 / 작성일
  ws.getRow(1).height=50;
  ws.mergeCells('A1:E1');
  const logoId=wb.addImage({base64:LOGO,extension:'jpeg'});
  ws.addImage(logoId,{tl:{col:0.05,row:0.08},ext:{width:270,height:51}});
  ws.mergeCells(2,1,2,5);ws.getCell(2,1).value='제조요청사양서';ws.getCell(2,1).font={name:FONT,size:20,bold:true};ws.getCell(2,1).alignment={horizontal:'center',vertical:'middle'};ws.getRow(2).height=36;
  put(3,1,1,'작성일',{b:1,fill:LB});put(3,2,5,today());fin(3);
  let r=3;

  const val=id=>show(id)||'';
  for(const s of LAYOUT){
    r+=2;put(r,1,5,'■ '+s.title,{b:1,fill:HD,color:'FFFFFFFF',size:11});fin(r);
    if(s.rows){
      if(s.sub){r++;put(r,1,2,s.sub[0],{b:1,fill:SB});put(r,4,5,s.sub[1],{b:1,fill:SB});fin(r)}
      for(const row of s.rows){
        r++;
        if(row.length===1){put(r,1,1,F[row[0]].l,{b:1,fill:LB});put(r,2,5,val(row[0]))}
        else{
          put(r,1,1,F[row[0]].l,{b:1,fill:LB});put(r,2,2,val(row[0]));
          if(s.sub)put(r,4,4,F[row[1]].l,{b:1,fill:LB});else put(r,3,4,F[row[1]].l,{b:1,fill:LB});
          put(r,5,5,val(row[1]));
        }
        fin(r);
      }
    }else{
      const k=s.key;
      if(V[s.id+'_a']){r++;put(r,1,5,'■ '+F[s.id].alt);fin(r)}
      for(const m of V[k+'Imgs']){
        r++;
        const sc=Math.min(1,700/m.w,520/m.h),w=Math.round(m.w*sc),h=Math.round(m.h*sc);
        for(let c=1;c<=5;c++)ws.getCell(r,c).border=BD;ws.mergeCells(r,1,r,5);
        ws.getRow(r).height=h*0.75+8;
        const id=wb.addImage({base64:m.url,extension:'jpeg'});
        ws.addImage(id,{tl:{col:0.1,row:r-1+0.04},ext:{width:w,height:h}});
      }
      if((V[k+'Note']||'').trim()){r++;put(r,1,1,'메모',{b:1,fill:LB});put(r,2,5,V[k+'Note']);fin(r)}
    }
  }
  return await wb.xlsx.writeBuffer();
}

/* PDF: 내용 길이와 관계없이 A4 세로 한 장에 맞춤.
   사양서를 A4 비율의 흰 판 위에 올리고, 판의 가로를 내용 높이에 맞춰 넓혀서 한 페이지로 축소 출력한다. */
async function buildPdf(){
  const src=$('#doc'),m=6,ratio=(297-2*m)/(210-2*m);
  const H=src.offsetHeight,W0=src.offsetWidth;
  const Wc=Math.max(W0,Math.ceil(H/ratio)+4),Hc=Math.floor(Wc*ratio)-4;
  const host=document.createElement('div');host.style.cssText='position:fixed;left:-20000px;top:0';
  const wrap=document.createElement('div');wrap.style.cssText=`width:${Wc}px;height:${Hc}px;background:#fff;overflow:hidden`;
  const c=src.cloneNode(true);c.style.margin='0 auto';wrap.appendChild(c);host.appendChild(wrap);document.body.appendChild(host);
  try{
    const opt={margin:[m,m,m,m],image:{type:'jpeg',quality:.95},html2canvas:{scale:2,useCORS:true,backgroundColor:'#ffffff',scrollY:0},
      jsPDF:{unit:'mm',format:'a4',orientation:'portrait'},pagebreak:{mode:[]}};
    return await html2pdf().set(opt).from(wrap).outputPdf('arraybuffer');
  }finally{host.remove()}
}

function getFile(kind){
  if(!cache[kind]){
    const p=(kind==='pdf'?buildPdf():buildXlsx()).then(b=>new File([b],baseName()+'.'+kind,{type:MIME[kind]}));
    p.catch(()=>{delete cache[kind]});
    cache[kind]=p;
  }
  return cache[kind];
}
async function busy(btn,fn){
  const t=btn.textContent;btn.disabled=true;btn.textContent='만드는 중…';
  try{await fn()}catch(err){console.error(err);toast('파일을 만들지 못했습니다: '+(err&&err.message||'알 수 없는 오류'))}
  btn.textContent=t;btn.disabled=!$('#okChk').checked;
}
$('#btnPdf').addEventListener('click',e=>{if(!need('html2pdf'))return;busy(e.target,async()=>{const f=await getFile('pdf');saveBlob(f,f.name);toast('PDF 파일을 만들었습니다')})});
$('#btnXlsx').addEventListener('click',e=>{if(!need('ExcelJS'))return;busy(e.target,async()=>{const f=await getFile('xlsx');saveBlob(f,f.name);toast('엑셀 파일을 만들었습니다')})});

/* ───────── 저장 / 불러오기 ───────── */
const KEY='mr_draft_v2';
function autosave(){try{const c=JSON.parse(JSON.stringify(V));c.boxImgs=[];c.ctgImgs=[];localStorage.setItem(KEY,JSON.stringify(c))}catch(_){}}
function adopt(o){V=Object.assign(freshState(),o);renderForm();showErrors([])}
(function restore(){try{const s=localStorage.getItem(KEY);if(s){adopt(JSON.parse(s));$('#restored').hidden=false;return}}catch(_){}renderForm()})();
function resetAll(){V=freshState();try{localStorage.removeItem(KEY)}catch(_){}renderForm();showErrors([]);$('#restored').hidden=true;window.scrollTo({top:0})}
let rstArm=0;
function armReset(btn){if(Date.now()-rstArm<4000){resetAll();btn.textContent=btn.dataset.t;rstArm=0;return}rstArm=Date.now();btn.dataset.t=btn.textContent;btn.textContent='한 번 더 누르면 모두 지워집니다';setTimeout(()=>{if(btn.dataset.t){btn.textContent=btn.dataset.t}},4000)}
$('#btnReset1').addEventListener('click',e=>armReset(e.target));
$('#btnReset2').addEventListener('click',e=>armReset(e.target));
$('#btnSaveJson').addEventListener('click',()=>{saveBlob(new Blob([JSON.stringify({v:2,V},null,1)],{type:'application/json'}),baseName()+'.json');toast('작성 내용을 파일로 저장했습니다. 비슷한 제품은 불러와서 수정하세요')});
$('#btnLoadJson').addEventListener('click',()=>$('#fileJson').click());
$('#fileJson').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{const o=JSON.parse(await f.text());if(!o||!o.V)throw 0;adopt(o.V);toast('저장한 내용을 불러왔습니다')}catch(_){toast('불러올 수 없는 파일입니다')}});

let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,4500)}
</script>
